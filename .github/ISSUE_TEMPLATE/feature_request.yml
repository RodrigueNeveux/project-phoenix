name: Feature request
description: Suggest an idea for Discord Phoenix
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: tos
    attributes:
      label: Checks
      options:
        - label: This feature does not require automating user accounts (self-bots), scraping, or bypassing Discord's limits.
          required: true
