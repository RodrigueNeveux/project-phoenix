name: Bug report
description: Something is broken in Discord Phoenix
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your Discord token, cookies or full HAR files.** Redact logs before posting.
        Discord Phoenix is unofficial; don't report its bugs to Discord.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Join a voice channel\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Discord Phoenix version
      placeholder: v0.1.0-beta.1 or commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux (Wayland), Linux (X11), Windows 10, Windows 11, macOS (Apple Silicon), macOS (Intel), Other]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: Debian 13, Windows 11 24H2, macOS 15.1...
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: NVIDIA GTX 1080 / 580.xx, AMD RX 6700 / Mesa 25.x, Apple M2...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [UI / rendering, Login / gateway, Messages, Voice audio, Video / screen share, Notifications, Other]
  - type: input
    id: codec
    attributes:
      label: Audio/video codec (voice/video bugs)
      placeholder: Opus, H.264, VP8, AV1...
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Run with `RUST_LOG=debug`. Remove tokens, emails and IDs you don't want public.
      render: text
