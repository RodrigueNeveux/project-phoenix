name: PR 18 platform tests

on:
  push:
    branches: [ci-pr-18-platforms]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Workspace tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: c0f9ab2a8ee91f5911181f81d40c5e07ea4d87a7
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools for static Opus
        run: brew install autoconf automake libtool
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-on-failure: true
      - run: cargo test --workspace --locked
