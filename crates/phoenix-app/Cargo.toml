[package]
name = "phoenix-app"
version.workspace = true
edition.workspace = true
description = "Discord Phoenix - native GPUI desktop client (UI shell)"

[[bin]]
name = "discord-phoenix"
path = "src/main.rs"

[lib]
name = "phoenix_app"
path = "src/lib.rs"

[dependencies]
# gpui-component 0.10 is built on the `gpui-pre` snapshot of GPUI (not gpui 0.2.x),
# so we alias it as `gpui` and pull the matching native platform crate.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
gpui-component = "0.10.0"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
phoenix-api = { path = "../phoenix-api" }
phoenix-voice = { path = "../phoenix-voice", features = ["audio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
base64 = "0.22"
anyhow = "1"
serde_json = "1"
parking_lot = "0.12"
notify-rust = "4.19"
qrcode = { version = "0.14", default-features = false }
brotli-decompressor = "4"
flate2 = "1"
wuff = "0.2"
ttf-parser = "0.25"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
anyhow = "1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"] }
