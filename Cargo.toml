[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
gpui-pre = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "265d221153834585e61151baf6bd6dbd0c8a2ea7" }
gpui-pre-wgpu = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "265d221153834585e61151baf6bd6dbd0c8a2ea7" }
