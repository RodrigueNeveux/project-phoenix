[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Vendored GPUI with the subpixel layout patch (docs/gpui-patches.md).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
