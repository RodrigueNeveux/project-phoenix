[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
gpui-pre = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "0ce4a85b44ce5fb920531d5b21fe2ed1b531dc15" }
gpui-pre-wgpu = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "0ce4a85b44ce5fb920531d5b21fe2ed1b531dc15" }
