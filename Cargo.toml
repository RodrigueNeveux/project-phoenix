[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
gpui-pre = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "2143fc3c5eb55fd7af0ab3c7c3f44bdb9ce24d7c" }
gpui-pre-wgpu = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "2143fc3c5eb55fd7af0ab3c7c3f44bdb9ce24d7c" }
gpui-base = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "2143fc3c5eb55fd7af0ab3c7c3f44bdb9ce24d7c" }
gpui-pre-linux = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "9de5c47872aaf8b7a5d4c27a19875e29e9a15644" }
