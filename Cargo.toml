[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Vendored GPUI with the subpixel layout patch (docs/gpui-patches.md).
[patch.crates-io]
# Pulled by git rev (not path) so every worktree shares one compiled GPUI: a path
# dependency gets a different package id per checkout and rebuilds the whole GUI stack.
# Update the rev after changing vendor/gpui-pre (see docs/gpui-patches.md).
gpui-pre = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "eea2827db5a821879e5de42267fab20d45cde8bf" }
