[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
gpui-pre = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "42aa62d2473ac6c97e8f2be2dd5bf8881392d70d" }
gpui-pre-wgpu = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "42aa62d2473ac6c97e8f2be2dd5bf8881392d70d" }
gpui-base = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "42aa62d2473ac6c97e8f2be2dd5bf8881392d70d" }
